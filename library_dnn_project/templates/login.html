<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Library Demand Prediction System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-icon">📚</span>
      <h1>Library Dashboard</h1>
      <p class="subtitle">DNN Demand Prediction System — Librarian Login</p>
    </div>

    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="login-form">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required autofocus>

      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>

      <button type="submit">Log In</button>
    </form>

    <p class="hint login-hint">Default demo credentials: <strong>admin</strong> / <strong>admin123</strong></p>
  </div>
</body>
</html>
